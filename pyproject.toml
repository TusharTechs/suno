[project]
name = "suno"
version = "0.1.0"
description = "SUNO: per-child learning evidence from ordinary classroom talk"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "anthropic>=1.15",
    "pydantic>=2.8",
    "python-dotenv>=1.0",
    "numpy>=2.0",
    "pandas>=2.2",
    "soundfile>=0.12",
    "jsonschema>=4.23",
    "httpx>=0.27",
]

[dependency-groups]
# Speech front end and the feasibility experiments in eval/feasibility/
speech = [
    "torch>=2.5",
    "torchaudio>=2.5",
    "speechbrain>=1.0",
    "transformers>=4.45",
    "pyroomacoustics>=0.8",
    "scipy>=1.13",
    "matplotlib>=3.9",
]
dev = ["pytest>=8"]

[tool.uv]
package = false
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
