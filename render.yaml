# Render Blueprint: SUNO on the FREE plan (no paid resources).
# - Web service (free): sleeps after 15 minutes without traffic, about 1 minute to wake.
# - Postgres (free): keeps teachers' classes across sleeps and redeploys. Render expires free
#   databases 30 days after creation (covers judging and the 18 Nov finale); upgrade or recreate after.
services:
  - type: web
    name: suno
    runtime: docker
    plan: free
    region: singapore
    branch: main
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    autoDeployTrigger: commit
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: SARVAM_API_KEY
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: SUNO_DATABASE_URL
        fromDatabase:
          name: suno-db
          property: connectionString
      - key: CLAUDE_MODEL
        value: claude-opus-5-5
      - key: SUNO_NOTE_EFFORT
        value: high
      - key: SUNO_BRIEF_EFFORT
        value: medium
      - key: SUNO_ASR_KEYTERMS
        value: "off"
      - key: SUNO_SECURE_COOKIE
        value: "1"
      - key: SUNO_DEMO_CODE
        value: SUNO-DEMO
      - key: SUNO_NOTES_PER_DAY
        value: "25"
      - key: SUNO_BRIEFS_PER_DAY
        value: "12"
      - key: VO_SPEAKER
        value: shubh

databases:
  - name: suno-db
    plan: free
    region: singapore
    databaseName: suno
    user: suno
    ipAllowList: []   # reachable only from Render services
